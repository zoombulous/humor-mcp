[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "humor-mcp"
version = "0.1.0"
description = "An MCP server over a local humor corpus that credits every line it returns"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "James Barker" }]
keywords = ["mcp", "model-context-protocol", "humor", "corpus", "attribution"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
# The server, the pack model and every text importer are stdlib only. Audio is
# the single exception, so it stays an extra rather than a dependency.
dependencies = []

[project.optional-dependencies]
audio = ["numpy>=1.22", "scipy>=1.8", "soundfile>=0.12"]

[project.urls]
Homepage = "https://github.com/zoombulous/humor-mcp"
Source = "https://github.com/zoombulous/humor-mcp"

[project.scripts]
humor-mcp = "humor_mcp.cli:main"

[tool.setuptools]
packages = ["humor_mcp"]

# The bundled corpus deliberately does NOT ship in the wheel: it is ~9 MB of
# other people's material, two packs of it non-commercial. `uvx humor-mcp` gives
# you the tool and reads the corpus in HUMOR_HOME; clone the repo if you want
# the bundled packs too.
