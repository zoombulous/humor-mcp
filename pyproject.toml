[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "humor-mcp"
version = "0.1.3"
description = "An MCP server over a local humor corpus that credits every line it returns"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "James Barker" }]
keywords = ["mcp", "model-context-protocol", "humor", "corpus", "attribution"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
# The server, the pack model and every text importer are stdlib only. Audio is
# the single exception, so it stays an extra rather than a dependency.
dependencies = []

[project.optional-dependencies]
audio = ["numpy>=1.22", "scipy>=1.8", "soundfile>=0.12"]

[project.urls]
Homepage = "https://github.com/zoombulous/humor-mcp"
Source = "https://github.com/zoombulous/humor-mcp"

[project.scripts]
humor-mcp = "humor_mcp.cli:main"

[tool.setuptools]
packages = ["humor_mcp"]

# The author's own pack ships INSIDE the wheel, so `uvx humor-mcp` arrives
# working: a corpus, 975 human ratings and the best-of-N picks, with nothing to
# download and nothing to wire together. It is CC-BY-4.0 and commercially
# usable, which is what makes it safe to bundle.
#
# The third-party packs deliberately do NOT ship: ~7 MB of other people's
# material, and cup/expun are CC-BY-NC, which would quietly saddle every
# installer with a non-commercial restriction. Clone the repo for those.
[tool.setuptools.package-data]
humor_mcp = ["packs/*/*.json", "packs/*/*.jsonl"]
